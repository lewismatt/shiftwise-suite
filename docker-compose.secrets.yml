# Optional Docker-secrets wiring for the PostgreSQL password.
#
# Usage:
#   1. Create the secret file (never commit it — /secrets/ is gitignored):
#        mkdir -p secrets
#        printf '%s' 'your-strong-password' > secrets/postgres_password
#        chmod 600 secrets/postgres_password
#   2. Bring up the stack with this file layered over the base compose file:
#        docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build
#
# What changes:
#   - The postgres service reads its password from /run/secrets/postgres_password
#     (POSTGRES_PASSWORD_FILE, the official image's _FILE variant).
#     POSTGRES_PASSWORD is blanked because the postgres image refuses to start
#     when both POSTGRES_PASSWORD and POSTGRES_PASSWORD_FILE are set.
#   - The app service gets the same secret mounted and reads it at startup via
#     POSTGRES_PASSWORD_FILE (see shiftwise/db.py::_resolve_database_url),
#     assembling DATABASE_URL from POSTGRES_USER / POSTGRES_DB. The password
#     never appears in `docker compose config` output or the container
#     environment.
#
# Precedence: when POSTGRES_PASSWORD_FILE is set, the secret wins and
# DATABASE_URL is assembled from it — even if DATABASE_URL is also set.
# Secrets mode targets the bundled postgres service.

secrets:
  postgres_password:
    file: ./secrets/postgres_password

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
  app:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
