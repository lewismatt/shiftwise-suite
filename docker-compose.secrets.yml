# Optional Docker-secrets wiring for the PostgreSQL password.
#
# Usage:
#   1. Create the secret file (never commit it — /secrets/ is gitignored).
#      The app runs as UID 10001, so the file must be readable by that user:
#        mkdir -p secrets
#        printf '%s' 'your-strong-password' > secrets/postgres_password
#        sudo chown 10001:10001 secrets/postgres_password
#        chmod 600 secrets/postgres_password
#   2. Bring up the stack with this file layered over the base compose file:
#        docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build
#
# What changes:
#   - The postgres service reads its password from /run/secrets/postgres_password
#     (POSTGRES_PASSWORD_FILE, the official image's _FILE variant).
#     POSTGRES_PASSWORD is blanked because the postgres image refuses to start
#     when both POSTGRES_PASSWORD and POSTGRES_PASSWORD_FILE are set.
#   - The app service gets the same secret mounted and reads it at startup via
#     POSTGRES_PASSWORD_FILE (see shiftwise/db.py::_resolve_database_url),
#     assembling DATABASE_URL from POSTGRES_USER / POSTGRES_DB (passed through
#     here so --env-file and shell overrides reach the app). DATABASE_URL is
#     blanked so a stale value from .env cannot leak the password into the
#     container environment. The password never appears in
#     `docker compose config` output or the container environment.
#
# Precedence: when POSTGRES_PASSWORD_FILE is set, the secret wins and
# DATABASE_URL is assembled from it. Do not set DATABASE_URL in .env when
# using secrets mode. Secrets mode targets the bundled postgres service.

secrets:
  postgres_password:
    file: ./secrets/postgres_password

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
  app:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Pass through so custom values (via --env-file or shell) reach the app;
      # the app assembles DATABASE_URL from these plus the secret.
      POSTGRES_USER: ${POSTGRES_USER:-shiftwise}
      POSTGRES_DB: ${POSTGRES_DB:-shiftwise}
      # Blanked: a stale DATABASE_URL from .env must not leak the password
      # into the container environment when secrets mode is active.
      DATABASE_URL: ""
    secrets:
      - postgres_password
