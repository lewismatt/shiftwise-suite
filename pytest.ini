[pytest]
testpaths = tests
pythonpath = . tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    sqlite_only: test exercises SQLite-only adapter internals; skipped on PostgreSQL
    pg_own_isolation: module manages its own PostgreSQL isolation; skip the shared TRUNCATE fixture
addopts = -ra
# pytest-timeout (dev extras): cap any single test so a lock wait or dialect
# error cannot hang the suite indefinitely. Pytest warns (does not fail) if
# the plugin is absent.
timeout = 180
