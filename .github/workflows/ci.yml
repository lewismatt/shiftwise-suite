name: CI

# Two jobs:
#   verify   -- dependency-free guard: tracked shell entrypoints keep
#               their executable bit (./tools/check_entrypoints.py).
#   postgres -- live PostgreSQL 16 acceptance (partially delivers Phase 5
#               "CI Pipeline Integration"): ruff, the Postgres regression
#               test modules, and the quick scenario tools, all against a
#               pg:16 service.
#               The full pytest suite stays SQLite-only for now: its
#               per-test isolation is file-based (isolated_db swaps DB_PATH),
#               so on one shared Postgres database the tests pollute each
#               other (a trial full-suite run failed 74 tests via data
#               pollution, lastrowid use, lock pile-up and pool exhaustion).
#               Making the whole suite Postgres-safe is follow-up work,
#               tracked in issue #39. The heavy liveweek gauntlet stays manual.
# This is not a required status check: blocking merges needs branch protection,
# which needs repo admin.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tracked entrypoints stay executable
        run: ./tools/check_entrypoints.py

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shiftwise_test
          POSTGRES_USER: shiftwise
          POSTGRES_PASSWORD: shiftwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftwise -d shiftwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shiftwise:shiftwise@localhost:5432/shiftwise_test
      TEST_DATABASE_URL: postgresql://shiftwise:shiftwise@localhost:5432/shiftwise_test
      SHIFTWISE_DB_ENGINE: postgres  # fail-fast: db.py raises if DATABASE_URL is missing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Assert PostgreSQL backend is active
        run: python -c "import app; assert app.database_engine() == 'postgres', 'not on Postgres'"
      - name: Ruff lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Postgres regression tests
        # phase4 uses a throwaway schema per test; phase3 drives the shared
        # public schema and is safe because the CI steps run sequentially.
        run: python -m pytest tests/test_postgres_phase3.py tests/test_postgres_phase4.py -q
      - name: Conflict gauntlet on PostgreSQL
        run: python tools/gauntlet.py
      - name: Scenario simulation on PostgreSQL
        run: python tools/scenario_demo.py
      - name: Chaos simulation (pinned seed) on PostgreSQL
        run: python tools/scenario_random.py 42
