[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# F: pyflakes, E4/E7/E9: pycodestyle errors (runtime/syntax class),
# I: isort (import sorting)
select = ["F", "E4", "E7", "E9", "I"]

[tool.ruff.lint.per-file-ignores]
# Keep the app.py facade exceptions required by AGENTS.md §8.
# The facade forwards notification monkeypatches to dynamically imported consumers.
"app.py" = ["F822", "E402"]
# shiftwise-mock/app.py inserts the repo root into sys.path before importing
# the app package; the resulting E402 is intentional.
"shiftwise-mock/app.py" = ["E402"]
# tools/*.py scripts insert the repo root into sys.path before their imports;
# those E402s are intentional.
"tools/*.py" = ["E402"]
# tests/*.py helpers insert the repo root into sys.path before importing
# test_support and the app package; those E402s are intentional.
"tests/*.py" = ["E402"]
