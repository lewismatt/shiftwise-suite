{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Notifications</h1>
{% if notifs | selectattr('read', 'equalto', false) | list %}
<form method="post" action="{{ url_for('read_notifications') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <button class="btn sm ghost" type="submit">Mark all as read</button>
</form>
{% endif %}
{% if notifs %}
<form method="post" action="{{ url_for('delete_all_notifications') }}" style="margin-top:8px" onsubmit="return confirm('Delete all your notifications? This cannot be undone.');">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <button class="btn sm ghost" type="submit">Delete all notifications</button>
</form>
{% endif %}
{% for n in notifs %}
  <div class="notif {{ 'unread' if not n.read }} {{ n.kind }}">
    {{ n.message }}
    <div class="when">{{ n.created_at }}</div>
    <form method="post" action="{{ url_for('delete_notification', notification_id=n.id) }}" style="margin-top:8px">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <button class="btn sm ghost" type="submit" aria-label="Delete notification">Delete</button>
    </form>
  </div>
{% else %}
  <p class="muted">No notifications yet.</p>
{% endfor %}
{% endblock %}
